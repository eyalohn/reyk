name: Run Tests

on:
  push:
    branches:
      - '**'

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.os }} / ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    env:
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Setup test libs
        run: make install-test-libs

      - name: Run Tests
        run: make test
        env:
          COVERAGE_FILE: coverage/.coverage.${{ runner.os }}-py${{ matrix.python-version }}
          CONTEXT: ${{ runner.os }}-py${{ matrix.python-version }}-without-deps

      - name: Store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage
          include-hidden-files: true

  pytest-memray: # Only runs on Linux
    runs-on: ubuntu-latest
    name: Test with Memray ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    env:
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --group testing-extra --all-extras --all-packages

      - name: Setup test libs
        run: make install-test-libs

      - name: Run Tests
        run: make test-library-memray
