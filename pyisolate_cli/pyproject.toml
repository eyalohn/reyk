[project]
name = "pyisolate-cli"
version = "0.1.0"
description = "Manage isolated environment dependencies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.20.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
pyisolate-cli = "pyisolate_cli.cli:app"
