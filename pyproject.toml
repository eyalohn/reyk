[project]
name = "pyisolate"
version = "0.1.0"
description = "Transparent dependency isolation for Python packages using vendored libraries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.setuptools.packages.find]
include = ["pyisolate"]

[tool.uv.workspace]
members = [
    "pyisolate_cli",
]
