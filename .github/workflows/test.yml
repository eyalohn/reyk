name: Run Tests

on:
  push:
    branches:
      - '**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: Test ${{ matrix.os }} / ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --group testing-extra --all-extras --all-packages

      - name: Run Tests
        run: uv run pytest

  pytest-memray: # Only runs on Linux
    runs-on: ubuntu-latest
    name: Test with Memray ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --group testing-extra --all-extras --all-packages

      - name: Run Tests
        run: uv run pytest --memray
